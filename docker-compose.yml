services:
  mongodb:
    image: mongo:7-jammy
    container_name: labelly-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - labelly-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: labelly-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/labelly}
      - JWT_SECRET=${JWT_SECRET:-labelly_super_secret_jwt_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CORS_ORIGIN=*
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads-data:/app/uploads
    networks:
      - labelly-network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: labelly-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - labelly-network

  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile.dev
    container_name: labelly-mobile
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://localhost:5000}
    depends_on:
      - server
    networks:
      - labelly-network

volumes:
  mongo-data:
  uploads-data:

networks:
  labelly-network:
    driver: bridge
